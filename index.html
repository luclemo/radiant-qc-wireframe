<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Tab Prototype</title>
<style>
/* Layout: the case page as it ships (header, tabs, sub-views), one column of cards, prototype controls floating bottom-right */
/* Single light theme on purpose: it mocks the product's light UI */
:root{
  --bg:#f3f5f7; --surface:#fff; --line:#d9dee3; --line-soft:#eceff2; --ink:#1f2933; --muted:#5b6670; --faint:#9aa4ad;
  --pass-bg:#e3f4e8; --pass-fg:#1b6b38; --warn-bg:#fdf0d5; --warn-fg:#8a5a00; --fail-bg:#fde4e4; --fail-fg:#b42318; --unm-bg:#e6e9ec; --unm-fg:#4a545d;
  --bar-p:#8fd1a5; --bar-w:#f0c25a; --bar-f:#e5736a; --bar-u:#9aa4ad;
  --zone-p:#bfe5cb; --zone-w:#f6d98f; --zone-f:#f4b4ae;
  --demo:#3b4cca; --demo-bg:#eef0ff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.page{max-width:1280px;margin:0 auto;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.page{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.h2{margin:0;font-size:17px;font-weight:650}
.h3{margin:0;font-size:15px;font-weight:650}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.cap{margin:18px 0 0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.r,.tbl th.r{text-align:right}
.row-between{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p{background:var(--pass-bg);color:var(--pass-fg)}.w{background:var(--warn-bg);color:var(--warn-fg)}.f{background:var(--fail-bg);color:var(--fail-fg)}.u{background:var(--unm-bg);color:var(--unm-fg)}
.ghost{background:var(--unm-bg);color:var(--muted)}
/* Value + status in one chip: Pass stays a plain value; the icon hangs left so values still line up */
.vs{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;margin:-2px 0 -2px -25px;border-radius:6px;font-weight:600;white-space:nowrap}
.vs svg{flex:none}
.tbl .vc{padding-left:34px}
.btn{font-weight:600;font-size:13px;padding:7px 12px;border:1px solid #c5ccd3;border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:34px}
.btn[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{font-weight:600;font-size:13px;color:var(--ink);background:none;border:0;padding:6px 4px;text-decoration:underline;cursor:pointer}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.in{font-weight:400;font-size:14px;color:var(--ink);border:1px solid #c5ccd3;border-radius:6px;padding:7px 10px;background:var(--surface);min-height:36px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.key i{display:inline-block;width:16px;height:8px;border-radius:2px}
.tip{position:relative;display:inline-flex;vertical-align:middle}
.tip>button{background:none;border:0;padding:4px;margin:-4px 0;color:var(--muted);cursor:help;display:inline-flex;border-radius:4px}
.bubble{display:none;position:absolute;top:100%;left:-8px;z-index:5;width:300px;margin-top:6px;padding:10px 12px;background:var(--ink);color:#fff;border-radius:6px;font-size:12.5px;line-height:1.5;font-weight:400;text-transform:none;letter-spacing:0;white-space:normal;text-align:left}
.bubble.right{left:auto;right:-8px}
.bubble span{display:block}
.tip:hover .bubble,.tip:focus-within .bubble{display:block}

/* Case header + tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs>span{padding:10px 14px;font-size:14px;color:var(--muted)}
.tabs .on{color:var(--ink);font-weight:650;border-bottom:2px solid var(--ink);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fail-fg);display:inline-block}
.alert{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;background:var(--fail-bg);border:1px solid #f0b4ae;border-radius:8px;padding:14px 18px}
.alert>div{flex:1 1 420px;min-width:0}
.alert b{color:var(--fail-fg)}

/* Threshold scales (overview) */
.ms{position:relative;display:inline-block;width:80px;height:6px;border-radius:3px;overflow:hidden;vertical-align:middle}
.ms i,.fs i{position:absolute;top:0;bottom:0}
.msw{position:relative;display:inline-block;width:80px;height:12px;vertical-align:middle;margin-left:8px}
.msw .ms{position:absolute;left:0;top:3px}
.msw b{position:absolute;top:0;width:2px;height:12px;background:var(--ink);margin-left:-1px}
.fsw{position:relative;display:inline-block;width:240px;height:18px;vertical-align:middle}
.fs{position:absolute;left:0;top:4px;width:240px;height:10px;border-radius:2px;overflow:hidden}
.fsw b{position:absolute;top:0;width:2px;height:18px;background:var(--ink);margin-left:-1px}
.tk{position:relative;display:block;width:240px;height:14px;margin-top:4px;font-weight:400}
.tk span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.tk span:first-child{transform:none}.tk span:last-child{transform:translateX(-100%)}
.ped{position:relative;width:520px;height:196px;margin:0 auto}
.ped .ln{position:absolute;background:var(--muted)}
.ped .nd{position:absolute;width:34px;height:34px}
.ped .lb{position:absolute;width:120px;text-align:center;font-size:13px;line-height:1.3}
.ped .ar{position:absolute;font-size:18px}
.dim{opacity:.55}

/* Gene coverage */
.seg{font-size:13px;border:1px solid #c5ccd3;border-radius:999px;background:var(--surface);padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.seg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg i{display:inline-block;width:12px;height:8px;border-radius:2px}
.gtbl{min-width:760px}
.sb{background:none;border:0;padding:4px 2px;margin:-4px -2px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:4px;white-space:nowrap;font-weight:600;font-size:12px;color:var(--muted)}
.sb:hover,.sb[data-on="true"]{color:var(--ink)}
.sb i{font-style:normal;font-size:12px;width:12px;visibility:hidden}
th:hover .sb i,.sb:focus-visible i,.sb[data-on="true"] i{visibility:visible}
.cb{width:16px;height:16px;padding:0;border:1.5px solid var(--muted);border-radius:3px;background:var(--surface);color:#fff;font:700 11px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.cb[aria-checked="true"],.cb[aria-checked="mixed"]{background:var(--ink);border-color:var(--ink)}
.gc{display:grid;grid-template-columns:132px auto;align-items:center;gap:8px;white-space:nowrap}
.gc .pill{font-size:11.5px;padding:2px 7px}
.chev{background:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:6px;font-size:14px}
.chev:hover{background:var(--line-soft)}
.ex{display:flex;gap:3px;height:26px;margin-top:10px}
.ex span{display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);border-radius:3px;min-width:0;overflow:hidden;white-space:nowrap}
.dash{border:1px dashed var(--faint);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--muted)}

/* Metric details */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px;align-items:start}
.src{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.dl{margin:10px 0 0;display:flex;flex-direction:column}
.mrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:6px 0;border-bottom:1px solid #f0f2f4}
.mrow:last-child{border-bottom:0}
.mrow dt{flex:1 1 150px;min-width:0}
.mrow dd{margin:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.mrow dd>span:first-child{display:inline-flex;align-items:center;gap:8px}
.mrow.fw{background:#fffaf0;margin:0 -8px;padding:6px 8px}.mrow.ff{background:#fff7f6;margin:0 -8px;padding:6px 8px}
.mkey{font:12.5px var(--mono);overflow-wrap:anywhere}
.rule{font-size:12px}

/* Prototype controls: visibly not part of the design */
.demo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:1.5px dashed var(--demo);border-radius:10px;box-shadow:0 6px 24px rgba(31,41,51,.18);font-size:13px}
.demo header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 12px;background:var(--demo-bg);border-radius:9px 9px 0 0;color:var(--demo);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.demo header button{background:none;border:0;color:var(--demo);cursor:pointer;font-weight:600;font-size:12px;padding:4px 6px;border-radius:4px}
.demo .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.demo .opt{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px;color:var(--muted)}
.demo .sg{display:flex;border:1px solid #c5ccd3;border-radius:6px;overflow:hidden}
.demo .sg button{flex:1;border:0;background:var(--surface);padding:6px 8px;cursor:pointer;font-size:13px}
.demo .sg button+button{border-left:1px solid #c5ccd3}
.demo .sg button[aria-pressed="true"]{background:var(--demo);color:#fff}
.demo .hint{margin:0;font-size:11.5px;color:var(--muted)}
.demo-min{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;border:1.5px dashed var(--demo);background:var(--demo-bg);color:var(--demo);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.btn,.seg,.sb{transition:background-color .12s,color .12s}}
</style>
</head>

// ---------- Shell ----------
function shell(body) {
  const v = S.view;
  const soloShort = S.fetal ? 'Contamination above the 5% fail limit.' : 'Declared sex does not match measured sex.';
  const soloLong = S.fetal
    ? 'Contamination is 7.8%, above the 5% fail limit. In a fetal sample this often points to maternal cells. Results for this case are not reliable until this is resolved.'
    : 'Declared sex is male, but measured sex (ploidy) is XX. Possible sample swap. Results for this case are not reliable until this is resolved.';
  const short = { solo: soloShort, trio: 'Not related to the proband.', quatuor: 'Not related to either child.', 'mother-sibling': 'Not related to the proband or the mother.' }[S.family];
  const long = {
    solo: soloLong,
    trio: 'Not related to the proband: relatedness 0.03, expected ≥ 0.35. Possible sample swap or non-paternity. Trio-based results (de novo, inheritance) are not reliable until this is resolved.',
    quatuor: 'Not related to either child: 0.03 with the proband, 0.04 with the sister, expected ≥ 0.35. The mother matches both children, so the father sample is the likely problem. Possible sample swap or non-paternity.',
    'mother-sibling': 'Not related to the proband or the mother: 0.04 and 0.03, expected ≥ 0.35. The proband matches the mother, so the sister sample is the likely problem. Possible sample swap.'
  }[S.family];
  const text = v === 'overview' ? long : short + ' ' + (v === 'genes' ? 'Coverage for this sample may describe the wrong person.' : 'Metrics below may describe the wrong person.');
  const banner = failed()
    ? '<div class="alert" role="alert">' + WARN + '<div><p style="margin:0"><b>Identity check failed · ' + esc(plabel(culprit())) + '</b></p><p style="margin:4px 0 0">' + text + '</p></div><button type="button" class="btn" data-act="goIdentity">See identity checks</button></div>'
    : '';

    .map(([k, l]) => '<a class="btn" href="#' + k + '" data-act="view" data-v="' + k + '"' + (k === v ? ' aria-current="page"' : '') + '>' + l + '</a>').join('');
  return '<div class="row-between"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="font-size:20px;font-weight:700">Case 1042</span><span class="pill ghost">Germline · ' + (S.family === 'solo' ? 'Solo' : 'Family') + '</span>' + (S.fetal ? '<span class="pill ghost">Prenatal</span>' : '') + '<span class="pill ghost">WXS</span><span class="pill ghost">In Progress</span></div></div>'

    + banner

    + (!fail ? '<div class="row-between" style="margin-top:10px"><span style="color:var(--muted)">' + (solo ? 'Sex and contamination pass. Relatedness is not checked in a solo analysis.' : 'Sex, contamination and relatedness pass for ' + seq.length + ' samples.') + '</span>' + toggle + '</div>' : '')
    + (showFamily ? '<p class="cap">Family</p><div style="margin-top:10px;padding:14px 8px 6px;background:#f8f9fa;border-radius:6px;overflow-x:auto"><div class="ped">' + lines + nodes + '</div></div>'
      + '<p class="cap">Relatedness · ' + pairs.length + ' pairs</p><div class="scroll" style="margin-top:8px;border:1px solid var(--line-soft);border-radius:6px"><table class="tbl" style="min-width:640px"><thead><tr><th>Pair</th><th>Expected</th><th style="width:300px">Relatedness<span class="tk"><span style="left:0">0</span><span style="left:33.33%">0.20</span><span style="left:58.33%">0.35</span><span style="left:100%">0.60</span></span></th><th class="vc">Value</th></tr></thead><tbody>' + pairRows + '</tbody></table></div>'

// ---------- Gene coverage (board E) ----------
const DEPTHS = [5, 15, 30, 50, 100, 200, 300, 400, 500, 1000];
const NAME = { p: 'Pass', w: 'Warning', f: 'Fail', u: 'Unmappable' };
const ORDER = ['f', 'w', 'u', 'p'];
const UP = ['BRCA1', 'NF1', 'CFTR', 'AKR1B15', 'ACKR4', 'TMIE', 'SOX4', 'CACNA1A', 'BRCA3'];
const KNOWN = new Set(DATA.genes.map((g) => g[0]));

// Everything that decides which genes are in the table, so filter changes can prune the selection (as in PR 1820)
function geneView(s) {
  const P = PEOPLE[s.sample];
  const all = DATA.genes.map(([gene, size, mean, p]) => ({ gene, size, mean: mean * P.cov_f, pct: p.map((x) => Math.pow(x / 10000, P.cov_k)) }));
  const statusOf = (g) => {
    if (g.mean < 5 || g.pct[0] < 0.10) return 'u';
    const v = g.pct[s.depthIdx];
    return v >= s.cutoff - 1e-9 ? 'p' : v >= 0.90 ? 'w' : 'f';
  };
  let base = all;
  if (s.q) base = base.filter((g) => g.gene.toUpperCase().includes(s.q.toUpperCase()));
  if (s.panel) { const ps = new Set(DATA.panels[s.panel]); base = base.filter((g) => ps.has(g.gene)); }
  if (s.uploaded) { const us = new Set(UP); base = base.filter((g) => us.has(g.gene)); }
  base = base.map((g) => Object.assign(g, { s: statusOf(g) }));
  const counts = { p: 0, w: 0, f: 0, u: 0 };
  base.forEach((g) => { counts[g.s]++; });
  const list = s.statusF ? base.filter((g) => g.s === s.statusF) : base.slice();
  return { base, list, counts };
}
const visibleKeys = (dIdx, showAll) => ['gene', 'size', 'mean'].concat(DEPTHS.map((d, i) => 'd' + i).filter((k, i) => showAll || i === dIdx));
const keepVisible = (sorts, dIdx, showAll) => { const v = visibleKeys(dIdx, showAll); return sorts.filter((x) => v.includes(x.k)); };
// Round down so a gene short of 100% never reads 100.0
const pct1 = (v) => (Math.floor(v * 1000 + 1e-6) / 10).toFixed(1);
const wm = (l) => { const sz = l.reduce((a, g) => a + g.size, 0); return sz ? Math.round(l.reduce((a, g) => a + g.mean * g.size, 0) / sz) + 'x' : '—'; };
const isSel = (gene) => (S.gc.selMode === 'all' ? !S.gc.selIds[gene] : !!S.gc.selIds[gene]);
let GC = null; // last computed gene table, used by the click handlers

function setGc(o) {
  const g = S.gc, next = Object.assign({}, g, o);
  const n = { page: 0 };
  if (o.sample !== undefined && o.sample !== g.sample) { n.selMode = 'picked'; n.selIds = {}; }
  else {
    const names = new Set(geneView(next).list.map((x) => x.gene));
    const kept = {};
    Object.keys(g.selIds).forEach((x) => { if (names.has(x)) kept[x] = true; });
    n.selIds = kept;
  }
  if (o.depthIdx !== undefined) n.sorts = keepVisible(g.sorts, o.depthIdx, g.allDepths);
  S.gc = Object.assign(next, n, o);
}

function genes() {
  const g = S.gc;
  const { depthIdx, cutoff, statusF, allDepths } = g;
  const { base, list, counts } = geneView(g);
  const sorts = keepVisible(g.sorts, depthIdx, allDepths);
  const cutPct = Math.round(cutoff * 100);
  const cutLabel = cutoff >= 1 ? '100%' : '≥ ' + cutPct + '%';
  const val = { gene: (x) => x.gene, size: (x) => x.size, mean: (x) => x.mean };
  DEPTHS.forEach((d, i) => { val['d' + i] = (x) => x.pct[i]; });
  list.sort((a, b) => {
    for (const x of sorts) {
      const va = val[x.k](a), vb = val[x.k](b);
      const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      if (c) return x.desc ? -c : c;
    }
    return ORDER.indexOf(a.s) - ORDER.indexOf(b.s) || a.pct[depthIdx] - b.pct[depthIdx] || a.gene.localeCompare(b.gene);
  });
  const LABEL = { gene: 'Gene', size: 'Size', mean: 'Mean cov.' };
  DEPTHS.forEach((d, i) => { LABEL['d' + i] = '% ≥ ' + d + 'x'; });
  const sortText = sorts.length ? 'sorted by ' + sorts.map((x) => LABEL[x.k] + (x.desc ? ' ↓' : ' ↑')).join(', then ') : 'worst first';
  const PER = 20;
  const pages = Math.max(1, Math.ceil(list.length / PER));
  const pg = Math.min(g.page, pages - 1);
  const slice = list.slice(pg * PER, pg * PER + PER);
  const pageIds = slice.map((x) => x.gene);
  const pageFull = pageIds.length > 0 && pageIds.every(isSel);
  const pageSome = pageIds.some(isSel);
  const selected = list.filter((x) => isSel(x.gene));
  const canSelectAll = g.selMode === 'picked' && pageFull && list.length > pageIds.length;
  GC = { pageIds, pageFull, sorts };
  const shown = DEPTHS.map((d, i) => i).filter((i) => allDepths || i === depthIdx);
  const FRAME = 'box-shadow:inset 1px 0 0 #1f2933,inset -1px 0 0 #1f2933';
  const TINT = { w: 'background:var(--warn-bg);color:var(--warn-fg)', f: 'background:var(--fail-bg);color:var(--fail-fg)' };
  const ruleLines = [['Pass', cutLabel + ' of bases at ≥ ' + DEPTHS[depthIdx] + 'x']].concat(cutoff > 0.9 ? [['Warning', '90% to under ' + cutPct + '%']] : []).concat([['Fail', 'under 90%'], ['Unmappable', 'mean under 5x, or under 10% of bases at ≥ 5x. Checked first.']])
    .map(([k, v]) => '<span><strong>' + k + '</strong> ' + v + '</span>').join('');
  const head = (k, label, cls) => {
    const x = sorts.find((y) => y.k === k);
    return '<th' + (cls ? ' class="' + cls + '"' : '') + ' aria-sort="' + (x ? (x.desc ? 'descending' : 'ascending') : 'none') + '"><button type="button" class="sb" data-on="' + !!x + '" title="' + (x ? (x.desc ? 'Descending' : 'Ascending') : 'Sort') + '" data-act="sort" data-k="' + k + '">' + label + '<i aria-hidden="true">' + (x ? (x.desc ? '↓' : '↑') : '⇅') + '</i></button></th>';
  };
  const depthHeads = shown.map((i) => {
    const x = sorts.find((y) => y.k === 'd' + i), crit = i === depthIdx;
    return '<th class="r" style="' + (crit && allDepths ? FRAME : '') + '" aria-sort="' + (x ? (x.desc ? 'descending' : 'ascending') : 'none') + '"><span style="display:inline-flex;align-items:center;gap:4px">'
      + (crit ? '<span class="tip"><button type="button" aria-label="How gene statuses are set" aria-describedby="pct-tip">' + INFO + '</button><span class="bubble right" role="tooltip" id="pct-tip">' + ruleLines + '</span></span>' : '')
      + '<button type="button" class="sb" data-on="' + !!x + '" title="' + (x ? (x.desc ? 'Descending' : 'Ascending') : 'Sort') + '" data-act="sort" data-k="d' + i + '">% ≥ ' + DEPTHS[i] + 'x<i aria-hidden="true">' + (x ? (x.desc ? '↓' : '↑') : '⇅') + '</i></button></span></th>';
  }).join('');
  const P = PEOPLE[g.sample];
  const AKR = [[197, 159], [183, 167], [226, 173], [150, 2], [256, 169]];
  const rows = slice.map((x) => {
    const unm = x.s === 'u', open = !!g.open[x.gene], on = isSel(x.gene);
    const cells = shown.map((i) => {
      const v = x.pct[i];
      const k = unm || i > depthIdx || v >= cutoff - 1e-9 ? '' : v >= 0.90 ? 'w' : 'f';
      const crit = i === depthIdx;
      return '<td class="num r" style="' + (k ? TINT[k] : crit ? 'color:var(--ink)' : 'color:var(--muted)') + (crit ? ';font-weight:650' + (allDepths ? ';' + FRAME : '') : '') + '">' + pct1(v) + '</td>';
    }).join('');
    let exon = '';
    if (open) {
      const ex = x.gene === 'AKR1B15'
        ? AKR.map(([bp, c], i) => { const bad = c * P.cov_f < DEPTHS[depthIdx]; return '<span style="flex:' + bp + ' 1 0;background:' + (bad ? '#f4b4ae' : '#bfe5cb') + ';color:' + (bad ? '#b42318' : '#1b6b38') + (bad ? ';box-shadow:inset 0 0 0 2px #b42318' : '') + '">' + (i + 1) + ' · ' + Math.round(c * P.cov_f) + 'x</span>'; })
        : [3, 2, 4, 2, 3, 5].map((w, i) => '<span style="flex:' + w + ' 1 0;background:#e6e9ec;color:var(--muted)">' + (i + 1) + '</span>');
      const nBad = x.gene === 'AKR1B15' ? ex.filter((e) => e.includes('#b42318')).length : 0;
      exon = '<tr><td></td><td colspan="' + (5 + shown.length) + '" style="padding:4px 10px 14px"><div style="border:1px dashed var(--faint);border-radius:6px;padding:12px 14px;background:#fafbfc"><div class="row-between" style="align-items:baseline"><span style="font-size:13px;font-weight:650">Exon detail · ' + x.gene + ' <span style="font-weight:400;color:var(--muted)">' + (x.gene === 'AKR1B15' ? '· ' + nBad + ' of 5 exons out of criteria (simulated)' : '· placeholder, no exon data in the mockup') + '</span></span><span class="pill ghost">Later release</span></div><div class="ex" role="img" aria-label="Exon strip">' + ex.join('') + '</div><p style="margin:8px 0 0;font-size:12px;color:var(--muted)">Width = exon size · colour = exon status at the current criteria. Then: per-exon table, copy under-covered regions as BED.</p></div></td></tr>';
    }
    return '<tr><td><button type="button" class="cb" role="checkbox" aria-checked="' + on + '" aria-label="Select ' + x.gene + '" data-act="selRow" data-g="' + esc(x.gene) + '">' + (on ? '✓' : '') + '</button></td>'
      + '<td><span class="gc"><strong>' + esc(x.gene) + '</strong><span>' + (x.s !== 'p' ? '<span class="pill ' + x.s + '">' + NAME[x.s] + '</span>' : '') + '</span></span></td>'
      + '<td class="num r">' + x.size.toLocaleString('en-CA') + '</td><td class="num r">' + x.mean.toFixed(1) + 'x</td>' + cells
      + '<td style="white-space:nowrap"><a href="#genes" class="tl">SNV</a> · <a href="#genes" class="tl">CNV</a> · <a href="#genes" class="tl">IGV</a></td>'
      + '<td><button type="button" class="chev" aria-expanded="' + open + '" aria-label="' + (open ? 'Hide' : 'Show') + ' exon detail for ' + esc(x.gene) + '" data-act="exon" data-g="' + esc(x.gene) + '">' + (open ? '▾' : '▸') + '</button></td></tr>' + exon;
  }).join('');
  const total = base.length, nSel = selected.length;
  const panelNames = Object.keys(DATA.panels);
  const pageCheck = pageFull ? 'true' : pageSome ? 'mixed' : 'false';
  const chip = (k, label, n) => '<button type="button" class="seg" aria-pressed="' + (statusF === k) + '" data-act="statusF" data-s="' + k + '">' + (k ? '<i style="background:var(--bar-' + k + ')"></i>' : '') + '<strong class="num">' + n + '</strong>' + label + '</button>';

  return '<section class="card" aria-label="Sample, filters and criteria">'
    + '<div style="display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end">'
    + '<label class="fld" style="flex:0 1 240px">Sample<select class="in" id="gc-sample" data-in="gcSample">' + opts(members().map((k) => [k, plabel(k)]), g.sample) + '</select></label>'
    + '<div style="flex:1 1 520px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;padding-left:24px;border-left:1px solid var(--line-soft);min-width:0">'
    + '<label class="fld" style="flex:1 1 180px">Gene<input class="in" id="gc-q" type="search" placeholder="Search a gene symbol" value="' + esc(g.q) + '" data-in="gcQ"></label>'
    + '<label class="fld" style="flex:1 1 220px">Panel<select class="in" id="gc-panel" data-in="gcPanel">' + opts([['', 'All genes in the analysis']].concat(panelNames.map((n) => [n, n + ' (' + DATA.panels[n].filter((x) => KNOWN.has(x)).length + ' of ' + DATA.panels[n].length + ')'])), g.panel) + '</select></label>'
    + (g.uploaded
      ? '<span class="pill ghost" style="display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;font-size:13px;color:var(--ink)">my_genes.txt · ' + UP.filter((x) => KNOWN.has(x)).length + ' genes<span style="color:var(--warn-fg)">· ' + UP.filter((x) => !KNOWN.has(x)).length + ' not found</span><button type="button" class="chev" style="width:24px;height:24px" aria-label="Remove uploaded list" data-act="upload">✕</button></span>'
      : '<button type="button" class="btn" data-act="upload"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>Upload gene list</button>')
    + '</div></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)">'
    + '<p class="cap" style="flex:0 0 100%;margin:0;display:flex;align-items:center;gap:4px">QC criteria <span class="tip"><button type="button" aria-label="How gene statuses are set" aria-describedby="crit-tip">' + INFO + '</button><span class="bubble" role="tooltip" id="crit-tip">' + ruleLines + '</span></span></p>'
    + '<label class="fld" style="flex:0 1 140px">Minimum depth<select class="in" id="gc-depth" data-in="gcDepth">' + opts(DEPTHS.map((d, i) => [i, d + 'x']), depthIdx) + '</select></label>'
    + '<label class="fld" style="flex:0 1 160px">Bases at that depth<select class="in" id="gc-cut" data-in="gcCut">' + opts([[1, '100%'], [0.98, '≥ 98%'], [0.95, '≥ 95%'], [0.9, '≥ 90%']], cutoff) + '</select></label>'
    + (depthIdx !== 1 || cutoff !== 1 ? '<button type="button" class="lnk" data-act="resetCriteria">Reset to lab default (15x on 100%)</button>' : '')
    + '</div></section>'

    + '<section class="card" aria-labelledby="sumh"><div class="row-between" style="align-items:baseline"><h2 class="h2" id="sumh">' + total + ' genes · ' + DEPTHS[depthIdx] + 'x on ' + cutLabel + ' of bases</h2><span style="font-size:13px;color:var(--muted)">' + plabel(g.sample) + ' · weighted mean coverage <strong class="num" style="color:var(--ink)">' + wm(base) + '</strong></span></div>'
    + '<div role="img" aria-label="' + ORDER.map((k) => counts[k] + ' ' + NAME[k]).join(', ') + '" style="display:flex;height:14px;border-radius:3px;overflow:hidden;margin-top:12px;gap:2px;background:var(--line-soft)">' + ['p', 'w', 'f', 'u'].filter((k) => counts[k]).map((k) => '<span style="flex:' + counts[k] + ' 1 0;min-width:3px;background:var(--bar-' + k + ')"></span>').join('') + '</div>'
    + '<div role="group" aria-label="Filter the table by status" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' + chip('', 'All', total) + ORDER.map((k) => chip(k, NAME[k], counts[k])).join('') + '</div></section>'

    + '<section class="card" style="padding:0" aria-labelledby="tblh">'
    + '<div class="row-between" style="padding:14px 20px"><h2 class="h2" id="tblh">Genes <span style="font-weight:400;color:var(--muted);font-size:14px">· ' + list.length + (statusF ? ' ' + NAME[statusF].toLowerCase() : '') + ' · ' + sortText + '</span>' + (sorts.length ? ' <button type="button" class="lnk" style="font-size:13px" data-act="resetSort">Reset sort</button>' : '') + '</h2>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'
    + (nSel ? '<span style="font-size:13px"><strong>' + nSel.toLocaleString('en-CA') + (nSel === 1 ? ' item selected' : ' items selected') + '</strong> · weighted mean <span class="num">' + wm(selected) + '</span></span>' + (canSelectAll ? '<button type="button" class="lnk" data-act="selectAll">Select all</button>' : '<button type="button" class="lnk" data-act="clearSel">Clear selection</button>') : '')
    + '<button type="button" class="btn" aria-pressed="' + allDepths + '" data-act="toggleDepths">' + (allDepths ? 'Hide other depths' : 'Show all depths') + '</button>'
    + '<button type="button" class="btn">' + DL + (nSel ? 'Export selected (CSV)' : 'Export (CSV)') + '</button></div></div>'
    + '<div class="scroll" style="border-top:1px solid var(--line)"><table class="tbl gtbl"><thead><tr>'
    + '<th style="width:28px"><button type="button" class="cb" role="checkbox" aria-checked="' + pageCheck + '" aria-label="Select all rows on this page" data-act="selPage">' + (pageFull ? '✓' : pageSome ? '–' : '') + '</button></th>'
    + head('gene', 'Gene') + head('size', 'Size (bp)', 'r') + head('mean', 'Mean cov.', 'r') + depthHeads
    + '<th>Open in</th><th style="width:40px"><span style="position:absolute;left:-9999px">Exon detail</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    + (list.length ? '' : '<p style="margin:0;padding:20px;color:var(--muted)">No gene matches these filters.</p>')
    + '<div class="row-between" style="padding:10px 20px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)"><span>' + (list.length ? 'Results ' + (pg * PER + 1) + ' - ' + (pg * PER + slice.length) + ' of ' + list.length : '') + '</span><div style="display:flex;gap:8px"><button type="button" class="btn" data-act="page" data-d="-1"' + (pg === 0 ? ' disabled' : '') + '>Previous</button><button type="button" class="btn" data-act="page" data-d="1"' + (pg >= pages - 1 ? ' disabled' : '') + '>Next</button></div></div>'
    + '</section>';
}

// ---------- Metric details (board F) ----------
function technical() {
  const t = S.tech, k = t.sample, s = PEOPLE[k], f = s.tf;
  const n = (v) => Math.round(v).toLocaleString('en-CA');
  const M = (v) => [(v / 1e6).toFixed(1) + 'M', n(v)];
  const fem = s.ploidy === 'XX', sst = sexSt(k);
  const m = (label, key, value, th) => ({ label, key, value, th });
  const panels = [
    { id: 'aln', title: 'Alignment and reads', source: 'DRAGEN', rows: [
      m('Total reads', 'Total input reads', M(247482880 * f)),
      m('Mapped reads', 'Mapped reads', M(245349673 * f)),
      m('Unique reads (excl. duplicates)', 'Number of unique reads (excl. duplicate marked reads)', M(188835099 * f)),
      m('Properly paired reads', 'Properly paired reads', M(243665858 * f)),
      m('Estimated contamination', 'Estimated sample contamination', s.cont.toFixed(1) + '%', { rule: 'Warning > 2% · Fail > 5%', st: s.cont > 5 ? 'f' : s.cont > 2 ? 'w' : 'p' }),
      m('Read length', 'Estimated read length', '101'),
      m('Insert size (median)', 'Insert length: median', String(Math.round(134 + (1 - f) * 20))),
      m('Reads with MAPQ ≥ 40', 'Reads with MAPQ [40:inf)', M(225359925 * f)),
      m('Duplicate reads', 'PCT_EXC_DUPE (Picard)', s.dup.toFixed(1) + '%')
    ] },
    { id: 'cov', title: 'Coverage and uniformity', source: 'DRAGEN · QC region', rows: [
      m('Mean coverage', 'Average alignment coverage over QC coverage region', s.cov + 'x', { rule: 'Fail < 100x', st: s.cov < 100 ? 'f' : 'p' }),
      m('Median autosomal coverage', 'Median autosomal coverage over QC coverage region', Math.round(s.cov * 1.006) + 'x'),
      m('Mean / median ratio', 'Mean/Median autosomal coverage ratio over QC coverage region', '0.99'),
      m('Region ≥ 15x', 'PCT of QC coverage region with coverage [15x: inf)', s.r15.toFixed(1) + '%', { rule: 'Fail < 95%', st: s.r15 < 95 ? 'f' : 'p' }),
      m('Region ≥ 20x', 'PCT of QC coverage region with coverage [20x: inf)', (s.r15 - 0.2).toFixed(1) + '%'),
      m('Region ≥ 50x', 'PCT of QC coverage region with coverage [50x: inf)', (s.r15 - 1.3 - (1 - f) * 6).toFixed(1) + '%'),
      m('Region ≥ 100x', 'PCT of QC coverage region with coverage [100x: inf)', (88.2 - (1 - f) * 60).toFixed(1) + '%'),
      m('Uniformity (> 0.2 × mean)', 'Uniformity of coverage (PCT > 0.2*mean) over QC coverage region', (97.6 - (1 - f) * 6).toFixed(1) + '%'),
      m('Uniformity (> 0.4 × mean)', 'Uniformity of coverage (PCT > 0.4*mean) over QC coverage region', s.unif.toFixed(1) + '%', { rule: 'Warning < 93.91%', st: s.unif < 93.91 ? 'w' : 'p' })
    ] },
    { id: 'enr', title: 'Capture enrichment', source: 'Picard', rows: [
      m('Mean target coverage', 'MEAN_TARGET_COVERAGE', (179.8 * s.cov / 162).toFixed(1) + 'x'),
      m('Median target coverage', 'MEDIAN_TARGET_COVERAGE', Math.round(175 * s.cov / 162) + 'x'),
      m('Fold-80 base penalty', 'FOLD_80_BASE_PENALTY', s.f80.toFixed(2)),
      m('Fold enrichment', 'FOLD_ENRICHMENT', (48.0 * (0.9 + f / 10)).toFixed(1)),
      m('Selected bases', 'PCT_SELECTED_BASES', (82.5 * (0.95 + f / 20)).toFixed(1) + '%'),
      m('Off-bait bases', 'PCT_OFF_BAIT', (100 - 82.5 * (0.95 + f / 20)).toFixed(1) + '%'),
      m('Zero-coverage targets', 'ZERO_CVG_TARGETS_PCT', (0.67 / f).toFixed(2) + '%'),
      m('AT dropout', 'AT_DROPOUT', (3.17 / f).toFixed(2)),
      m('GC dropout', 'GC_DROPOUT', '0.00')
    ] },
    { id: 'sex', title: 'Sex and ploidy', source: 'DRAGEN', rows: [
      m('Declared sex', 'Case data', s.sex),
      m('Estimated ploidy', 'Ploidy estimation', s.ploidy, sst ? { rule: 'Must match declared sex', st: sst } : null),
      m('X / autosomal ratio', 'X / Autosomal ratio', fem ? '1.01' : '0.66'),
      m('Y / autosomal ratio', 'Y / Autosomal ratio', fem ? '0.00' : '0.49')
    ] },
    { id: 'var', title: 'Variants', source: 'DRAGEN · gVCF', rows: [
      m('Total', 'Total', n(492828 * (0.96 + f / 25))),
      m('SNVs', 'SNPs', n(408419 * (0.96 + f / 25))),
      m('Insertions', 'Insertions', n(39326 * (0.96 + f / 25))),
      m('Deletions', 'Deletions', n(43006 * (0.96 + f / 25))),
      m('Ti/Tv ratio', 'Ti/Tv ratio', (2.32 - (1 - f) * 0.3).toFixed(2)),
      m('Het/Hom ratio', 'Het/Hom ratio', (0.90 + (1 - f) * 0.4).toFixed(2)),
      m('Callable QC region', 'Percent QC Region Callability in Region 1', (98.8 - (1 - f) * 5).toFixed(1) + '%')
    ] },
    { id: 'cnv', title: 'CNV', source: 'DRAGEN', rows: [
      m('CNVs passing filters', 'Number of passing amplifications + deletions', String(s.amp + s.del), { rule: 'Warning > 504', st: s.amp + s.del > 504 ? 'w' : 'p' }),
      m('Amplifications (passing / total)', 'Number of passing amplifications / Number of amplifications', s.amp + ' / ' + Math.round(s.amp * 1.2)),
      m('Deletions (passing / total)', 'Number of passing deletions / Number of deletions', s.del + ' / ' + Math.round(s.del * 1.27)),
      m('Segments', 'Number of segments', n(10798 / f)),
      m('Coverage MAD', 'Coverage MAD', s.mad.toFixed(4))
    ] },
    { id: 'run', title: 'Sequencing run', source: 'LIMS', rows: [
      m('Run', 'runName', '20260629_LH00336_0448_B23LFFTLT3'),
      m('Flowcell', 'flowcell', 'B23LFFTLT3'),
      m('Sequencer', 'sequencer', 'LH00336'),
      m('Sequencing date', 'sequencingDate', '2026-06-29'),
      m('Capture kit', 'captureKit', 'Roche HyperExomeV2')
    ] }
  ];
  const flags = [];
  const cards = panels.map((p) => '<section class="card" style="padding:16px 18px" aria-labelledby="' + p.id + '-h"><div class="row-between" style="flex-wrap:nowrap"><h2 class="h3" id="' + p.id + '-h">' + p.title + '</h2><span class="src">' + p.source + '</span></div><dl class="dl">'
    + p.rows.map((r, i) => {
      const st = r.th ? r.th.st : null, flagged = st && st !== 'p', rid = p.id + '-' + i;
      if (flagged) flags.push({ label: r.label, href: rid, s: st });
      const val = Array.isArray(r.value) ? r.value : [r.value, ''];
      const color = st === 'f' ? 'var(--fail-fg)' : st === 'w' ? 'var(--warn-fg)' : '';
      return '<div class="mrow' + (flagged ? ' f' + st : '') + '" id="' + rid + '"><dt title="' + esc(t.showKeys ? r.label : r.key) + '"' + (t.showKeys ? '' : ' data-notr-title') + '>' + (t.showKeys ? '<span class="mkey">' + esc(r.key) + '</span>' : esc(r.label)) + '</dt>'
        + '<dd><span>' + (flagged ? '<span class="pill ' + st + '">' + NAME[st] + '</span>' : '') + '<span class="num"' + (flagged ? ' style="color:' + color + ';font-weight:700"' : '') + (val[1] ? ' title="' + val[1] + '"' : '') + '>' + esc(val[0]) + '</span></span>'
        + (flagged ? '<span class="rule" style="color:' + color + '">' + r.th.rule + '</span>' : '') + '</dd></div>';
    }).join('') + '</dl></section>').join('');
  const worst = flags.some((x) => x.s === 'f') ? 'f' : flags.length ? 'w' : 'p';
  return '<section class="card" style="padding:16px 20px" aria-label="Sample">'
    + '<div class="row-between" style="align-items:flex-end"><label class="fld" style="width:240px;max-width:100%">Sample<select class="in" id="tech-sample" data-in="techSample">' + opts(members().map((x) => [x, plabel(x)]), k) + '</select></label>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center"><label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;min-height:36px"><input type="checkbox" id="tech-keys" data-in="techKeys"' + (t.showKeys ? ' checked' : '') + ' style="width:16px;height:16px;margin:0">Show metric names</label><button type="button" class="btn" title="' + s.id + '.QC_report.json">' + DL + 'Download Dragen report (JSON)</button></div></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)"><span class="pill ' + worst + '">' + NAME[worst] + '</span><span>' + (flags.length ? flags.length + (flags.length > 1 ? ' metrics outside' : ' metric outside') + ' lab thresholds:' : 'All thresholded metrics within lab limits.') + '</span>'
    + flags.map((x) => '<a href="#metrics" data-act="jump" data-id="' + x.href + '" style="font-weight:600;font-size:13px">' + x.label + '</a>').join('') + '</div></section>'
    + '<div class="grid3">' + cards + '</div>';
}

const FR_STATUS = { warning: 'attention', fail: 'échec', unmappable: 'non mappable', pass: 'conforme' };
const frPct = (c) => c.replace(/(\d+)%/, '$1 %');
const FR_RX = [
  [/^(Proband|Mother|Father|Sister)( · fetus)? \((DM\d+)\)$/, (m, p, f, id) => FR[p] + (f ? ' · fœtus' : '') + ' (' + id + ')'],
  [/^fetus \((DM\d+)\)$/, (m, id) => 'fœtus (' + id + ')'],
  [/^(\d+) pairs?$/, (m, n) => n + (n > 1 ? ' paires' : ' paire')],
  [/^(\d+) samples?$/, (m, n) => n + (n > 1 ? ' échantillons' : ' échantillon')],
  [/^(\d+) genes$/, (m, n) => n + ' gènes'],
  [/^(\d+)x on (100%|≥ \d+%) of bases$/, (m, d, c) => d + 'x sur ' + frPct(c) + ' des bases'],
  [/^(100%|≥ \d+%) of bases at ≥ (\d+)x$/, (m, c, d) => frPct(c) + ' des bases à ≥ ' + d + 'x'],
  [/^90% to under (\d+)%$/, (m, n) => '90 % à moins de ' + n + ' %'],
  [/^Sex and contamination pass for (\d+) samples$/, (m, n) => 'Sexe et contamination conformes pour ' + n + ' échantillons'],
  [/^Sex, contamination and relatedness pass for (\d+) samples\.$/, (m, n) => 'Sexe, contamination et parenté conformes pour ' + n + ' échantillons.'],
  [/^Contamination, highest ([\d.]+)%$/, (m, v) => 'Contamination, maximum ' + v + ' %'],
  [/^(\d+) metrics? outside lab thresholds:$/, (m, n) => n + (n > 1 ? ' métriques hors des seuils' : ' métrique hors des seuils') + ' du laboratoire :'],
  [/^Results (\d+) - (\d+) of (\d+)$/, (m, a, b, c) => 'Résultats ' + a + ' - ' + b + ' de ' + c],
  [/^([\d,]+) items? selected$/, (m, n) => n + (n === '1' ? ' élément sélectionné' : ' éléments sélectionnés')],
  [/^(\d+) not found$/, (m, n) => n + (n > 1 ? ' introuvables' : ' introuvable')],
  [/^(\d+) of 5 exons out of criteria \(simulated\)$/, (m, n) => n + ' exon(s) sur 5 hors critères (simulé)'],
  [/^(\d+) (warning|fail|unmappable|pass)$/, (m, n, s) => n + ' ' + FR_STATUS[s]],
  [/^sorted by (.+)$/, (m, s) => 'trié par ' + s.split(', then ').map((x) => { const y = x.match(/^(.*) ([↑↓])$/); return y ? frText(y[1]) + ' ' + y[2] : x; }).join(', puis ')],
  [/^Select (.+)$/, (m, g) => 'Sélectionner ' + g],
  [/^(Show|Hide) exon detail for (.+)$/, (m, a, g) => (a === 'Show' ? 'Afficher' : 'Masquer') + ' le détail des exons de ' + g],
  [/^(.+) \((\d+) of (\d+)\)$/, (m, p, a, b) => frText(p) + ' (' + a + ' sur ' + b + ')'],
  [/^\d+ (Fail|Warning|Unmappable|Pass|fail|warning|unmappable|pass)(, \d+ \w+)+$/, (m) => m.split(', ').map((x) => x.replace(/^(\d+) (\w+)$/, (z, n, st) => n + ' ' + FR_STATUS[st.toLowerCase()])).join(', ')]
];
// Exact match, then patterns, then ' · ' segments, then sentences
function frText(s) {
  if (FR[s] !== undefined) return FR[s];
  for (const [rx, fn] of FR_RX) { const m = s.match(rx); if (m) return fn(...m); }
  if (s.startsWith('· ')) return '· ' + frText(s.slice(2));
  if (s.includes(' · ')) return s.split(' · ').map(frText).join(' · ');
  const parts = s.split(/(?<=[.:]) (?=[A-Z])/);
  if (parts.length > 1) return parts.map(frText).join(' ');
  return s;
}
function frSpan(v) { const m = v.match(/^(\s*)([\s\S]*?)(\s*)$/); return m[2] ? m[1] + frText(m[2]) + m[3] : v; }
function translate(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) { if (!n.parentElement.closest('.mkey')) n.nodeValue = frSpan(n.nodeValue); }
  root.querySelectorAll('[title],[aria-label],[placeholder]').forEach((e) => ['title', 'aria-label', 'placeholder'].forEach((a) => {
    if (e.hasAttribute(a) && !(a === 'title' && e.hasAttribute('data-notr-title'))) e.setAttribute(a, frText(e.getAttribute(a)));
  }));
}

// ---------- Render + events ----------
const app = document.getElementById('app');
const demoEl = document.getElementById('demo');
function render() {
  const a = document.activeElement;
  const focusId = a && a.id ? a.id : null;
  const caret = a && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  scenario();
  const body = S.view === 'genes' ? genes() : S.view === 'metrics' ? technical() : overview();
  app.innerHTML = shell(body);
  demoEl.innerHTML = demo();
  document.documentElement.lang = S.lang;
  if (S.lang === 'fr') { translate(app); translate(demoEl); }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret && el.setSelectionRange) try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} } }
}
function go(view, scrollTo) {
  S.view = view;
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
  render();
  const el = scrollTo && document.getElementById(scrollTo);
  if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}
function fixSamples() {
  const ms = members();
  if (!ms.includes(S.gc.sample)) setGc({ sample: 'proband' });
  if (!ms.includes(S.tech.sample)) S.tech.sample = 'proband';
}
const ACT = {
  view: (d) => go(d.v),
  goIdentity: () => { S.ov.open = true; go('overview', 'identity'); },
  ovToggle: () => { S.ov.open = !S.ov.open; render(); },
  geneStatus: (d) => { setGc({ statusF: d.s }); go('genes'); },
  statusF: (d) => { setGc({ statusF: d.s }); render(); },
  upload: () => { setGc({ uploaded: !S.gc.uploaded }); render(); },
  resetCriteria: () => { setGc({ depthIdx: 1, cutoff: 1 }); render(); },
  toggleDepths: () => { const g = S.gc; g.sorts = keepVisible(g.sorts, g.depthIdx, !g.allDepths); g.allDepths = !g.allDepths; render(); },
  sort: (d) => {
    const k = d.k, sorts = GC.sorts, x = sorts.find((y) => y.k === k), firstDesc = k !== 'gene';
    S.gc.sorts = !x ? sorts.concat([{ k, desc: firstDesc }]) : x.desc === firstDesc ? sorts.map((y) => (y.k === k ? { k, desc: !y.desc } : y)) : sorts.filter((y) => y.k !== k);
    S.gc.page = 0; render();
  },
  resetSort: () => { S.gc.sorts = []; S.gc.page = 0; render(); },
  selRow: (d) => { applyPage([d.g], !isSel(d.g)); render(); },
  selPage: () => { applyPage(GC.pageIds, !GC.pageFull); render(); },
  selectAll: () => { S.gc.selMode = 'all'; S.gc.selIds = {}; render(); },
  clearSel: () => { S.gc.selMode = 'picked'; S.gc.selIds = {}; render(); },
  exon: (d) => { S.gc.open = Object.assign({}, S.gc.open, { [d.g]: !S.gc.open[d.g] }); render(); },
  page: (d) => { S.gc.page += Number(d.d); render(); document.getElementById('tblh').scrollIntoView({ block: 'start' }); },
  jump: (d) => { const el = document.getElementById(d.id); if (el) el.scrollIntoView({ block: 'center' }); },
  setIdentity: (d) => { S.identity = d.v; render(); },
  setLang: (d) => { S.lang = d.v; render(); },
  setFetal: (d) => { S.fetal = d.v === 'on'; render(); },
  setFamily: (d) => { S.family = d.v; fixSamples(); render(); },
  resetDemo: () => { S = Object.assign(DEFAULT(), { lang: S.lang }); go('overview'); },
  demoOpen: () => { S.demoOpen = true; render(); },
  demoClose: () => { S.demoOpen = false; render(); }
};
function applyPage(ids, selected) {
  const n = Object.assign({}, S.gc.selIds);
  ids.forEach((id) => { const tracked = S.gc.selMode === 'all' ? !selected : selected; if (tracked) n[id] = true; else delete n[id]; });
  S.gc.selIds = n;
}
const INPUT = {
  gcSample: (el) => setGc({ sample: el.value }),
  gcQ: (el) => setGc({ q: el.value }),
  gcPanel: (el) => setGc({ panel: el.value }),
  gcDepth: (el) => setGc({ depthIdx: Number(el.value) }),
  gcCut: (el) => setGc({ cutoff: Number(el.value) }),
  techSample: (el) => { S.tech.sample = el.value; },
  techKeys: (el) => { S.tech.showKeys = el.checked; },
  demoFamily: (el) => { S.family = el.value; fixSamples(); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) { if (e.target.closest('a[href="#genes"].tl')) e.preventDefault(); return; }
  e.preventDefault();
  ACT[el.dataset.act](el.dataset);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-in]');
  if (el && el.dataset.in === 'gcQ') { INPUT.gcQ(el); render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-in]');
  if (!el || el.dataset.in === 'gcQ') return;
  INPUT[el.dataset.in](el); render();
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'h' || e.key === 'H') && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { S.demoOpen = !S.demoOpen; render(); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) go(v); });
const start = location.hash.slice(1);
if (VIEWS.includes(start)) S.view = start;
